basePath: /api/v1
definitions:
  address.Address:
    properties:
      city:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      label:
        type: string
      phone:
        type: string
      postal_code:
        type: string
      province:
        type: string
      recipient_name:
        type: string
      street:
        type: string
      updated_at:
        type: string
    type: object
  address.CreateRequest:
    properties:
      city:
        maxLength: 100
        type: string
      is_default:
        type: boolean
      label:
        maxLength: 50
        type: string
      phone:
        type: string
      postal_code:
        maxLength: 10
        type: string
      province:
        maxLength: 100
        type: string
      recipient_name:
        maxLength: 100
        type: string
      street:
        type: string
    required:
    - city
    - phone
    - postal_code
    - province
    - recipient_name
    - street
    type: object
  address.UpdateRequest:
    properties:
      city:
        maxLength: 100
        type: string
      is_default:
        type: boolean
      label:
        maxLength: 50
        type: string
      phone:
        type: string
      postal_code:
        maxLength: 10
        type: string
      province:
        maxLength: 100
        type: string
      recipient_name:
        maxLength: 100
        type: string
      street:
        type: string
    type: object
  auth.AdminAuthResponse:
    properties:
      admin:
        $ref: '#/definitions/auth.AdminProfile'
      permissions:
        items:
          type: string
        type: array
      tokens:
        $ref: '#/definitions/auth.TokenPair'
    type: object
  auth.AdminLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.AdminProfile:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
    type: object
  auth.CustomerAuthResponse:
    properties:
      customer:
        $ref: '#/definitions/auth.CustomerProfile'
      tokens:
        $ref: '#/definitions/auth.TokenPair'
    type: object
  auth.CustomerLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.CustomerProfile:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
    type: object
  auth.CustomerRegisterRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - full_name
    - password
    - phone
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      token_type:
        type: string
    type: object
  cart.AddItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  cart.Cart:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/cart.CartItem'
        type: array
      updated_at:
        type: string
    type: object
  cart.CartItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/product.Product'
      product_id:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  cart.UpdateItemRequest:
    properties:
      quantity:
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  category.Category:
    properties:
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  order.CreateRequest:
    properties:
      address_id:
        type: string
      notes:
        maxLength: 500
        type: string
    required:
    - address_id
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/order.OrderItem'
        type: array
      notes:
        type: string
      ship_city:
        type: string
      ship_name:
        type: string
      ship_phone:
        type: string
      ship_postal:
        type: string
      ship_province:
        type: string
      ship_street:
        type: string
      status:
        $ref: '#/definitions/order.Status'
      total_amount:
        type: number
      updated_at:
        type: string
    type: object
  order.OrderItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/product.Product'
      product_id:
        type: string
      quantity:
        type: integer
      subtotal:
        type: number
      unit_price:
        type: number
    type: object
  order.OrdersPage:
    properties:
      items:
        items:
          $ref: '#/definitions/order.Order'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  order.Status:
    enum:
    - pending
    - confirmed
    - processing
    - shipped
    - delivered
    - cancelled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusConfirmed
    - StatusProcessing
    - StatusShipped
    - StatusDelivered
    - StatusCancelled
  product.Product:
    properties:
      category:
        $ref: '#/definitions/category.Category'
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      slug:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  product.ProductsPage:
    properties:
      items:
        items:
          $ref: '#/definitions/product.Product'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.ErrorResponse:
    description: Standard API error response
    properties:
      errors:
        example:
        - field is required
        items:
          type: string
        type: array
      message:
        example: Validation failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.Response:
    description: Standard API success response
    properties:
      data: {}
      message:
        example: Success
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: dev@petshop.com
    name: PetShop Dev
  description: REST API for PetShop e-commerce platform
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: PetShop API
  version: "1.0"
paths:
  /admin/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin and return tokens with RBAC permissions
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AdminAuthResponse'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Account inactive
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login admin
      tags:
      - Admin Auth
  /admin/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid admin refresh token for a new access token (rotation)
      parameters:
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenPair'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh admin token
      tags:
      - Admin Auth
  /categories:
    get:
      description: Returns all active product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/category.Category'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List categories
      tags:
      - Categories
  /categories/{slug}:
    get:
      description: Returns a single category by its slug
      parameters:
      - description: Category slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/category.Category'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get category by slug
      tags:
      - Categories
  /customer/addresses:
    get:
      description: Returns all shipping addresses for the authenticated customer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/address.Address'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List addresses
      tags:
      - Addresses
    post:
      consumes:
      - application/json
      description: Add a new shipping address for the authenticated customer
      parameters:
      - description: Address payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/address.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/address.Address'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create address
      tags:
      - Addresses
  /customer/addresses/{id}:
    delete:
      description: Remove a shipping address belonging to the authenticated customer
      parameters:
      - description: Address ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete address
      tags:
      - Addresses
    put:
      consumes:
      - application/json
      description: Update an existing shipping address (partial update)
      parameters:
      - description: Address ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/address.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/address.Address'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update address
      tags:
      - Addresses
  /customer/addresses/{id}/default:
    patch:
      description: Mark an address as the default shipping address
      parameters:
      - description: Address ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/address.Address'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set default address
      tags:
      - Addresses
  /customer/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a customer and return access + refresh tokens
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CustomerLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.CustomerAuthResponse'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Account inactive
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login customer
      tags:
      - Customer Auth
  /customer/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the provided refresh token. Works for both customer and
        admin.
      parameters:
      - description: Logout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout
      tags:
      - Customer Auth
  /customer/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access token (rotation)
      parameters:
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenPair'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh customer token
      tags:
      - Customer Auth
  /customer/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new customer account
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.CustomerRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registration successful
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.CustomerAuthResponse'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register customer
      tags:
      - Customer Auth
  /customer/cart:
    get:
      description: Returns the authenticated customer's cart with all items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get cart
      tags:
      - Cart
  /customer/cart/items:
    post:
      consumes:
      - application/json
      description: Add a product to the cart. If the product already exists, quantity
        is incremented.
      parameters:
      - description: Item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.AddItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Insufficient stock
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /customer/cart/items/{productId}:
    delete:
      description: Remove a specific product from the cart
      parameters:
      - description: Product ID (UUID)
        in: path
        name: productId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Set the quantity of a specific product in the cart
      parameters:
      - description: Product ID (UUID)
        in: path
        name: productId
        required: true
        type: string
      - description: Quantity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/cart.Cart'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Insufficient stock
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /customer/orders:
    get:
      description: Returns paginated order history for the authenticated customer
      parameters:
      - description: Filter by status (pending|confirmed|processing|shipped|delivered|cancelled)
        in: query
        name: status
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/order.OrdersPage'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create an order from the current cart. Decrements stock atomically
        within a transaction.
      parameters:
      - description: Checkout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/order.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/order.Order'
              type: object
        "400":
          description: Validation failed / empty cart
          schema:
            $ref: '#/definitions/response.ErrorResponse'
